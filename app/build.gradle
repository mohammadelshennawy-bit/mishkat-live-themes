plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mishkat.livethemes'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mishkat.livethemes'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources { noCompress 'jpg', 'png', 'ttf' }
}
